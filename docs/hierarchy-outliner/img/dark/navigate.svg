<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 172" role="img" aria-label="Levels Scene, Car, Body, Base: Enter goes down, Backspace goes up" style="display:block;width:100%;height:auto;background:#0A0D1C;border-radius:12px"><defs><linearGradient id="ho-navigate-accentGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2F6BFF"/><stop offset="0.5" stop-color="#8B5CFF"/><stop offset="1" stop-color="#FF5FA2"/></linearGradient><linearGradient id="ho-navigate-floorFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="1"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient><mask id="ho-navigate-floorMask"><rect x="900" y="300" width="1200" height="700" fill="url(#ho-navigate-floorFade)"/></mask><filter id="ho-navigate-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="ho-navigate-softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="34" y="16" width="104" height="46" rx="12" fill="#121836" stroke="#4A5070" stroke-width="2.5"/><text x="86.0" y="46.0" font-family="IBM Plex Sans, sans-serif" font-size="20" font-weight="600" fill="#E9ECF8" text-anchor="middle" >Scene</text><path d="M106 68 q8 20 42 16" fill="none" stroke="#3FD0FF" stroke-width="2.4" stroke-dasharray="5 4"/><path d="M142 76 l8 8 l-10 5" fill="none" stroke="#3FD0FF" stroke-width="2.4"/><rect x="152" y="48" width="104" height="46" rx="12" fill="#121836" stroke="#2F6BFF" stroke-width="2.5"/><text x="204.0" y="78.0" font-family="IBM Plex Sans, sans-serif" font-size="20" font-weight="600" fill="#E9ECF8" text-anchor="middle" >Car</text><path d="M224 100 q8 20 42 16" fill="none" stroke="#3FD0FF" stroke-width